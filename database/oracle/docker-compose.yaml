services:
  oracle:
    image: doctorkirk/oracle-19c:latest
    container_name: some-oracle
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_SID: ORCLCDB
      ORACLE_PDB: ORCLPDB1
      ORACLE_PWD: ${ORACLE_PASSWORD:-change_me}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - network
    restart: "no"
    shm_size: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  network:
    driver: bridge

volumes:
  oracle-data:
    name: oracle-data
